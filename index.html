<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погодний дашборд</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Шапка сайту -->
    <header>
        <h1>Погодний дашборд</h1>
        <nav>
            <a href="#current">Поточна погода</a> |
            <a href="#forecast">Прогноз</a>
        </nav>
        <br>
        <!-- Поле пошуку з правильним зв'язком label та input (Доступність) -->
        <label for="city-search">Пошук міста:</label>
        <input type="text" id="city-search" name="city" placeholder="Введіть назву...">
    </header>

    <hr> <!-- Лінія для візуального розділення, поки немає CSS -->

    <!-- Основний вміст сторінки -->
    <main>
        
        <!-- Секція 1: Поточна погода (одиничний блок) -->
        <section id="current">
            <h2>Поточна погода</h2>
            <!-- Атрибут alt обов'язковий для картинок -->
            <img src="assets/img/sunny.svg" alt="Іконка: сонячно, без опадів">
            <p>Київ: +21&deg;C, ясно</p>
        </section>

        <hr>

        <!-- Секція 2: Прогноз (містить повторювані елементи) -->
        <section id="forecast">
            <h2>Прогноз на кілька днів</h2>
            
            <!-- Картка 1 -->
            <article class="card">
                <h3>Понеділок</h3>
                <img src="assets/img/cloudy.svg" alt="Іконка: хмарно">
                <p>+18&deg;C</p>
            </article>

            <!-- Картка 2 -->
            <article class="card">
                <h3>Вівторок</h3>
                <img src="assets/img/rain.svg" alt="Іконка: дощ">
                <p>+16&deg;C</p>
            </article>
        </section>

        <hr>

        <!-- Необов'язковий, але корисний блок: поради -->
        <aside class="sidebar">
            <h2>Порада: Що вдягнути</h2>
            <p>На вулиці сонячно, але вітряно. Рекомендуємо взяти легку куртку!</p>
        </aside>

    </main>

    <hr>

    <!-- Підвал сторінки -->
    <footer>
        <p>Джерело даних: OpenWeatherMap API (навчальний приклад). &copy; 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
